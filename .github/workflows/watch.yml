name: Watch eBay

on:
  schedule:
    # Each run checks every 5 minutes for ~28 minutes, then starts the next run
    # itself (last step). GitHub's schedule is unreliable, so it's only a backup
    # that restarts the chain if it ever stops.
    - cron: "7,37 * * * *"
  # Pressing "Run workflow", or changing the watchlist, sends a Telegram
  # message confirming the tracker works and which cards it's watching.
  workflow_dispatch:
    inputs:
      mode:
        description: "check-in = send a Telegram check-in; watch = keep watching eBay"
        type: choice
        options: [check-in, watch]
        default: check-in
  push:
    branches: [main]
    paths: ["watchlist.txt", ".github/workflows/watch.yml", "tracker/**"]

# One run at a time; a new run waits for the previous one to finish.
concurrency:
  group: watch-ebay
  cancel-in-progress: false

permissions:
  contents: write   # saving watchlist changes made from Telegram, and keep-alive
  actions: write    # starting the next run (see the last step)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Optional: a WATCHLIST secret overrides watchlist.txt (keeps the list private).
      WATCHLIST: ${{ secrets.WATCHLIST }}
      EBAY_ITEM_LOCATION: ${{ vars.EBAY_ITEM_LOCATION }}
      AUCTION_WINDOW_MINUTES: ${{ vars.AUCTION_WINDOW_MINUTES || '10' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests python-dotenv

      - name: Restore list of listings already alerted
        uses: actions/cache/restore@v4
        with:
          path: state
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check eBay
        run: python -m tracker.cloud ${{ (github.event_name == 'schedule' || inputs.mode == 'watch') && '--minutes 28 --every 5' || '--hello' }}

      - name: Save list of listings already alerted
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: seen-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub turns off scheduled workflows after 60 days with no commits.
      # This makes a tiny commit every ~45 days so the tracker keeps running.
      - name: Keep alive
        if: ${{ github.event_name != 'push' }}
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "Keep scheduled checks alive" && git push
          fi

      # Start the next run straight away. GitHub's own schedule often skips
      # runs for hours, so the runs chain themselves instead. If another run is
      # already queued, GitHub keeps just one.
      - name: Start next run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main -f mode=watch
